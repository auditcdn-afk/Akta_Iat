# Bangun & kirim aplikasi ke hosting setiap kali master berubah.
#
# Hosting SIMPAS-IAT hanya menyediakan FTP — tanpa SSH, tanpa git di sisi server —
# sehingga tidak ada cara server menarik sendiri perubahan dari GitHub. Sebelum
# ada berkas ini, tiap perbaikan harus di-build manual lalu diunggah satu per satu
# lewat klien FTP, dan itu berkali-kali jadi sumber kesalahan: berkas terlewat,
# public/build tidak ikut, atau clear-cache lupa dipanggil sehingga Blade lama
# tetap dipakai dan perbaikannya terlihat "tidak berfungsi".
#
# Yang WAJIB disiapkan sekali di GitHub (Settings -> Secrets and variables -> Actions):
#   Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, DEPLOY_SECRET
#   Variables (opsional): FTP_SERVER_DIR, FTP_PROTOCOL, APP_URL
#
# Migrasi database SENGAJA tidak dijalankan otomatis — mengubah skema produksi
# harus keputusan sadar, bukan efek samping sebuah merge. Kalau ada migrasi baru,
# ringkasan di akhir menampilkan peringatan beserta URL yang harus dipanggil.

name: Deploy ke hosting

on:
  push:
    branches: [master]
  workflow_dispatch:

# Dua deploy yang berjalan bersamaan akan saling menimpa berkas di tengah unggahan
# dan meninggalkan server dalam keadaan campur aduk. Antrikan, jangan dibatalkan:
# deploy yang sudah separuh jalan justru berbahaya kalau dihentikan.
concurrency:
  group: deploy-produksi
  cancel-in-progress: false

jobs:
  deploy:
    name: Bangun, uji, lalu kirim
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          # Dibutuhkan langkah "deteksi migrasi baru" di bawah, yang membandingkan
          # commit ini dengan sebelumnya.
          fetch-depth: 2

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, gd, bcmath, intl
          coverage: none

      - name: Pasang dependensi PHP
        # --optimize-autoloader: tanpa ini, tiap kali kode memanggil sebuah
        # class, Composer mencarinya di disk lewat aturan PSR-4 (beberapa
        # kali stat/glob per class). Dengan ini, dibuat satu classmap datar
        # sekali saat build — lookup jadi baca array, bukan cari ke disk.
        # Sengaja tidak pakai --no-dev di sini karena langkah "Jalankan tes"
        # di bawah masih butuh dependensi dev (PHPUnit dkk).
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Siapkan .env sementara untuk pengujian
        # Hanya dipakai di dalam runner ini dan tidak pernah diunggah — .env
        # produksi ada di server dan termasuk daftar yang dikecualikan.
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan tes
        # Gerbang pengaman: kalau tes gagal, langkah unggah di bawah tidak pernah
        # berjalan dan server tetap memakai versi lama yang masih berfungsi.
        run: php artisan test

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bangun aset
        run: |
          npm ci
          npm run build

      - name: Pastikan hasil build ada
        # Kalau vite gagal diam-diam, jangan sampai server malah kehilangan
        # public/build dan seluruh tampilan aplikasi rusak.
        run: |
          test -f public/build/manifest.json \
            || { echo "::error::public/build/manifest.json tidak terbentuk — build gagal, deploy dihentikan."; exit 1; }
          echo "Aset terbangun:"
          ls -1 public/build/assets | head -5

      - name: Kirim ke hosting lewat FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ftps mengenkripsi kredensial. Kalau hosting menolaknya, ganti variabel
          # FTP_PROTOCOL jadi "ftp" — tapi sadari kata sandi akan terkirim polos.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          # Hanya berkas yang berubah yang diunggah; berkas asing di server tidak
          # dihapus (dangerous-clean-slate sengaja dibiarkan mati).
          exclude: |
            # .git di server web publik membocorkan seluruh kode & riwayatnya.
            # Ditulis dua bentuk sekaligus (dengan dan tanpa awalan **/) supaya
            # tidak bergantung pada tafsir glob satu pustaka tertentu.
            .git
            .git/**
            .gitignore
            .gitattributes
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**
            .env
            .env.*
            vendor/**
            storage/**
            bootstrap/cache/**
            database/*.sqlite
            composer.json
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            tailwind.config.js
            postcss.config.js
            phpunit.xml
            .phpunit.result.cache
            README.md
            # public/hot hanya dibuat `npm run dev`. Kalau berkas ini sampai ada di
            # server, Laravel mencari aset ke dev-server yang tidak ada dan seluruh
            # tampilan aplikasi rusak.
            public/hot

      - name: Bersihkan cache aplikasi
        # Tanpa ini, Blade dan konfigurasi yang sudah ter-cache di server tetap
        # dipakai — berkas baru terunggah tapi perubahannya tidak terlihat.
        #
        # Percobaan sebelumnya (dengan --fail, lalu tanpa --fail supaya isi
        # balasan terlihat) selalu menunjukkan HTTP 403 — tapi isinya BUKAN
        # penolakan token dari Laravel, melainkan halaman tantangan
        # "Just a moment..." dari Cloudflare yang memblokir permintaan otomatis
        # (curl, bukan browser sungguhan). Jadi tokennya tidak pernah salah;
        # permintaannya tidak pernah sampai ke Laravel sama sekali.
        #
        # Cloudflare mem-proxy nama domain, bukan alamat IP asalnya. Percobaan
        # pertama menyambung langsung ke IP origin (lewat --resolve, sertifikat
        # TLS tetap divalidasi dengan nama domain yang benar lewat SNI) supaya
        # lewat sama sekali dari proxy Cloudflare. Kalau itu ditolak server
        # (mis. firewall origin hanya menerima koneksi dari IP Cloudflare),
        # baru dicoba lewat domain biasa sebagai cadangan.
        id: clear_cache
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://simpas-iat.exprosalab.com' }}
          ORIGIN_IP: ${{ vars.ORIGIN_IP || '103.30.147.68' }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::warning::Secret DEPLOY_SECRET belum diisi — cache di server TIDAK dibersihkan, jadi perubahan Blade/konfigurasi belum tentu terlihat. Isi secret itu, atau panggil /deploy/clear-cache secara manual."
            echo "hasil=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOST=$(echo "$APP_URL" | sed -E 's#^https?://##; s#/.*##')

          # Penanda bahwa balasannya benar-benar datang dari DeployController,
          # bukan dari perantara di jalan. Dipilih baris yang HANYA ditulis
          # endpoint itu sendiri, tanpa syarat, dan tidak mungkin muncul di
          # halaman HTML mana pun.
          PENANDA_LARAVEL='--- Membangun ulang cache ---'

          # Dicatat per percobaan, bukan dibaca dari berkas terakhir: kalau
          # percobaan ke IP origin ditolak karena token lalu percobaan cadangan
          # kena tantangan Cloudflare, berkasnya tinggal menyimpan halaman
          # Cloudflare — dan bukti sesungguhnya (token yang berbeda) hilang.
          DITOLAK_TOKEN=0

          coba_bersihkan() {
            deskripsi="$1"; shift
            echo "--- mencoba: $deskripsi ---"
            STATUS=$(curl --show-error --silent --max-time 60 "$@" \
              --get "$APP_URL/deploy/clear-cache" \
              --data-urlencode "token=$DEPLOY_SECRET" \
              -o clear-cache.txt \
              -w "%{http_code}" || echo "000")
            echo "status HTTP: $STATUS"
            head -c 800 clear-cache.txt 2>/dev/null || true
            echo ""

            # Status 200 sendirian TIDAK membuktikan apa pun: halaman tantangan
            # bot Cloudflare ("One moment, please...") juga dikirim dengan status
            # 200. Deploy #110 lolos begitu — status 200 berisi halaman itu,
            # dilaporkan sukses, padahal permintaannya tidak pernah sampai ke
            # Laravel dan cache tidak pernah dibersihkan. Satu-satunya yang
            # membedakan adalah ISI balasannya, jadi isinya yang diperiksa.
            # -e wajib: penandanya diawali tanda hubung, dan tanpa -e grep
            # akan menganggapnya sebagai opsi baris perintah, bukan teks yang
            # dicari — pencariannya selalu gagal walau teksnya ada.
            if [ "$STATUS" = "200" ] && grep -qF -e "$PENANDA_LARAVEL" clear-cache.txt 2>/dev/null; then
              SAMPAI=1
            else
              SAMPAI=0
            fi

            if grep -q 'Token salah' clear-cache.txt 2>/dev/null; then
              DITOLAK_TOKEN=1
            fi
          }

          coba_bersihkan "langsung ke IP origin ($ORIGIN_IP), lewati Cloudflare" --resolve "$HOST:443:$ORIGIN_IP"

          if [ "$SAMPAI" != "1" ]; then
            coba_bersihkan "lewat domain biasa (via Cloudflare, cadangan)"
          fi

          if [ "$SAMPAI" != "1" ] && [ "$DITOLAK_TOKEN" = "1" ]; then
            # Balasan penolakan dari Laravel sendiri — permintaannya SAMPAI, cuma
            # ditolak. Dibedakan dari "gagal" karena obatnya lain sama sekali:
            # menyamakan DEPLOY_SECRET, bukan membuka link di browser. Inilah dua
            # hal yang dulu tertukar dan sempat membuat token dikira salah
            # padahal yang memblokir Cloudflare.
            HASIL=token
          elif [ "$SAMPAI" != "1" ]; then
            HASIL=gagal
          elif grep -q 'config:cache: OK' clear-cache.txt && grep -q 'route:cache: OK' clear-cache.txt; then
            HASIL=ok
          else
            # Laravel jalan dan cache lamanya terhapus, tapi cache barunya tidak
            # terbentuk (biasanya bootstrap/cache tidak bisa ditulis). Aplikasinya
            # TETAP BENAR — tapi berjalan tanpa cache: seluruh berkas config dan
            # routes/api.php di-parse ulang pada SETIAP request. Ini keadaan yang
            # paling mudah luput, karena halamannya tampil normal; yang berubah
            # hanya kecepatannya.
            HASIL=lambat
          fi

          echo "hasil=$HASIL" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "kesimpulan: $HASIL (HTTP $STATUS)"

          # Sengaja TIDAK exit 1 apa pun hasilnya: berkas sudah terkirim lewat FTP
          # di langkah sebelumnya, jadi deploy-nya sendiri sukses. Menggagalkan
          # seluruh job hanya karena langkah pembersihan cache akan menyesatkan —
          # seolah kode gagal terkirim padahal tidak.
          case "$HASIL" in
            gagal)
              echo "::warning::clear-cache TIDAK sampai ke aplikasi (HTTP $STATUS, isi balasan bukan dari Laravel — kemungkinan tantangan bot Cloudflare, BUKAN token yang salah). Kode sudah terkirim lewat FTP, tapi perubahan Blade/konfigurasi belum tentu terlihat sampai cache dibersihkan. Lihat ringkasan job."
              ;;
            lambat)
              echo "::warning::Cache lama terhapus tapi cache baru GAGAL dibangun ulang. Aplikasi tetap berjalan dan datanya benar, tapi LEBIH LAMBAT karena config dan route di-parse ulang tiap request. Lihat ringkasan job."
              ;;
            token)
              echo "::warning::clear-cache ditolak aplikasi: DEPLOY_SECRET di GitHub Secrets tidak sama dengan yang ada di .env server. Samakan keduanya — kali ini memang benar soal token, bukan Cloudflare."
              ;;
          esac

      - name: Ringkasan
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL || 'https://simpas-iat.exprosalab.com' }}
          CLEAR_HASIL: ${{ steps.clear_cache.outputs.hasil }}
          CLEAR_STATUS: ${{ steps.clear_cache.outputs.status }}
        run: |
          {
            echo "### Deploy SIMPAS-IAT"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""

            # Kosong (langkahnya tidak jalan) dan "skip"/"ok" tidak cocok ke
            # cabang mana pun, jadi diam — peringatan hanya muncul saat memang
            # ada yang perlu Anda kerjakan.
            case "$CLEAR_HASIL" in
              gagal)
                echo "> [!WARNING]"
                echo "> **Cache belum dibersihkan otomatis.** Server membalas HTTP $CLEAR_STATUS tapi isinya bukan dari Laravel — kemungkinan tantangan bot Cloudflare, BUKAN token yang salah."
                echo "> Kode sudah terkirim dan aplikasi tetap berjalan, tapi perubahan tampilan/konfigurasi belum tentu terlihat. Untuk membersihkannya, buka link ini sekali dari **browser biasa** (bukan otomatis — browser bisa lewati tantangan Cloudflare, curl tidak):"
                echo "> \`$APP_URL/deploy/clear-cache?token=...\` (ganti \`...\` dengan isi DEPLOY_SECRET Anda)"
                echo ""
                ;;
              token)
                echo "> [!WARNING]"
                echo "> **Cache belum dibersihkan: token ditolak aplikasi.** \`DEPLOY_SECRET\` di GitHub Secrets tidak sama dengan yang ada di berkas \`.env\` server."
                echo "> Samakan keduanya, lalu jalankan ulang deploy ini. Berbeda dari kasus Cloudflare, membuka link di browser TIDAK akan menolong selama tokennya masih berbeda."
                echo ""
                ;;
              lambat)
                echo "> [!WARNING]"
                echo "> **Cache lama terhapus, cache baru gagal dibangun ulang.** Aplikasi tetap berjalan dan datanya benar, tapi LEBIH LAMBAT: seluruh berkas config dan daftar route di-parse ulang pada setiap request, bukan dibaca dari satu berkas siap pakai."
                echo "> Penyebab tersering: folder \`bootstrap/cache\` di server tidak bisa ditulis. Periksa izinnya, lalu buka link ini sekali dari **browser biasa**:"
                echo "> \`$APP_URL/deploy/clear-cache?token=...\` (ganti \`...\` dengan isi DEPLOY_SECRET Anda)"
                echo ""
                ;;
            esac

            # Migrasi tidak dijalankan otomatis; kalau ada yang baru, beri tahu.
            BARU=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- database/migrations || true)
            if [ -n "$BARU" ]; then
              echo "> [!WARNING]"
              echo "> **Ada migrasi baru — skema database BELUM diubah.**"
              echo "> Panggil \`$APP_URL/deploy/migrate?token=...\` untuk menjalankannya."
              echo ""
              echo "$BARU" | sed 's/^/> - /'
            else
              echo "Tidak ada migrasi baru."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

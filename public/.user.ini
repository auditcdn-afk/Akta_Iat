; Hosting FTP-only ini (lihat docs/deploy-otomatis.md) memakai batas
; post_max_size/upload_max_filesize bawaan yang lebih kecil dari yang
; dibutuhkan formulir upload aplikasi (mis. Data Karyawan, Lampiran Audit) —
; PHP menolak requestnya SEBELUM sempat masuk ke Laravel sama sekali, jadi
; pesan yang muncul mentah "The POST data is too large." alih-alih validasi
; yang lebih jelas (mis. "Ukuran foto maksimal 2MB").
;
; Berlaku otomatis di hosting PHP-FPM/CGI/suPHP (mayoritas shared hosting
; modern) tanpa perlu restart — PHP membaca ulang file ini secara berkala
; (default tiap 300 detik). Tidak berpengaruh sama sekali kalau hosting
; menjalankan PHP sebagai modul Apache (mod_php) — bukan error, cuma diam.
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
